<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
</head>

<style>
    body {
    display : flex;
    justify-content: center;
    align-items: center;
    height : 100vh;
    background: #fdf5e6;
    font-family: Arial, Helvetica, sans-serif;
}

.calculator {
    background: #1e1e2f;
    padding: 25px;  
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    border: 3px solid #201f1f;
    margin: 20px;
}

.title {
    text-align: center;
    color: white;
    margin-bottom: 15px;
    font-weight: bold;
    letter-spacing: 1px;
}

#display {
    width : 94%;
    height: 60px;
    margin-bottom : 20px;
    font-size : 24px;
    text-align: right;
    padding : 10px;
    border-radius : 10px;
    border: none;
    outline: none;
    background: #2d2d44;
    color: white;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;  
}

button {
    padding:15px;
    font-size : 18px;
    border : none;
    border-radius : 10px;
    cursor : pointer;
    background: #3b3b5c;
    color: white;
    transition:0.2s;
}

button:hover {
    background: #581845;
}

.operator {
    background : #581845;
}

.operator:hover {
    background: #3b3b5c;
}

.equal {
    background : #581845;
    grid-column: span 2;
}

.equal:hover {
    background: #3b3b5c;
}

.clear {
    background : #581845;
}

.clear:hover {
    background: #3b3b5c;
}

.operator:hover {
    background: #3b3b5c
}

.delete {
    background: #581845;
}

.delete:hover {
    background: #3b3b5c;
}
</style>

<body>
    <section class="calculator">
        <h2 class="title">Smart Calculator</h2>
        <input type="text" id="display" disabled>

        <div class="buttons" id="buttons">

        </div>
    </section>


<script>

const display = document.getElementById("display");
const buttonsContainer = document.getElementById("buttons");

const buttons = [
    "AC", "DEL", "%", "/",
    "7", "8", "9", "*",
    "4", "5", "6", "-",
    "1", "2", "3", "+",
    "0", ".", "="
];

buttons.forEach(text => {
    const button = document.createElement("button");
    button.textContent = text;

    if (["/", "*", "-", "+", "%"].includes(text)) {
        button.classList.add("operator");

    }else if(text === "=") {
        button.classList.add("equal");
        
    }else if(text === "AC") {
        button.classList.add("clear");
    }    
    else if(text === "DEL") {
    button.classList.add("delete");
    }
    button.addEventListener("click", () => handleInput(text));

    buttonsContainer.appendChild(button);
});

function handleInput(value) {
    if (value === "AC") {
        display.value = "";
    }

    else if (value === "DEL") {
        display.value = display.value.slice(0, -1);
    }

    else if(value === "=") {
    try {
        display.value = eval(display.value);
    } catch {
        display.value = "Error";
    }
}

    else {
         display.value += value;
    }
}

document.addEventListener("keydown", (e) => {
    if(!isNaN(e.key) || ["+", "-", "*", "/", ".", "%"].includes(e.key)) {
        display.value += e.key;
    }
    else if (e.key === "Enter") {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
        }
        else if (e.key === "Backspace") {
            display.value = display.value.slice(0, -1);
        }
    else if (e.key === "Escape") {
            display.value = "";
    }
})

</script>    
</body>
</html>
